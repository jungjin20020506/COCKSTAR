# ===================================================================================
# 스토어 상품 자동 갱신 — 매주 월요일 새벽 3시(KST)에 노에러 공식몰에서 다시 받는다
# -----------------------------------------------------------------------------------
# 지금까지는 사람이 기억날 때만 `npm run fetch:products` 를 돌렸다. 가격·재고가
# 오래 묵으면 스토어 신뢰가 떨어진다. 이제 봇이 주 1회 받아서 바뀐 게 있으면
# 자동으로 커밋한다.
#
# ⚠️ 실패하면 저장소에 이슈가 자동으로 열린다 (GitHub 이 저장소 주인에게 메일을
#    보낸다). 이슈가 열렸는데 처리가 어려우면 jung22459369@gmail.com 으로 문의.
#    수동 실행: Actions 탭 → 이 워크플로 → Run workflow
# ===================================================================================
name: 상품 데이터 자동 갱신

on:
  schedule:
    # 매주 일요일 18:00 UTC = 월요일 03:00 KST
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 상품 데이터 받기
        run: npm run fetch:products -- --force

      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet -- src/data/noerrorProducts.json; then
            echo "상품 데이터에 변화가 없습니다."
            exit 0
          fi
          git config user.name "cockstar-bot"
          git config user.email "actions@github.com"
          git add src/data/noerrorProducts.json
          git commit -m "chore: 스토어 상품 데이터 주간 자동 갱신"
          git push

      # 실패 시 이슈를 연다 — GitHub 이 저장소 주인에게 알림 메일을 보낸다.
      # (반복 실패로 이슈가 쌓이지 않게, 열린 동일 제목 이슈가 있으면 건너뛴다)
      - name: 실패 시 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🛒 상품 자동 갱신 실패 — 확인 필요';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'store-sync',
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['store-sync'],
              body: [
                '주간 상품 데이터 갱신(fetch:products)이 실패했습니다.',
                '',
                `실패한 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '공식몰(pjbsports.com) 구조가 바뀌었을 가능성이 큽니다.',
                'scripts/fetch-noerror-products.mjs 를 점검하세요.',
                '',
                '처리가 어려우면 jung22459369@gmail.com 으로 문의해주세요.',
              ].join('\n'),
            });
